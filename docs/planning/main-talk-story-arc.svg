<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#060a1a"/>
  <text x="80" y="90" fill="#7dd3fc" font-family="monospace" font-size="20" letter-spacing="4">KUBECON JAPAN · MAIN TALK · STORY ARC</text>
  <text x="80" y="165" fill="#f8fafc" font-family="Arial, sans-serif" font-size="62" font-weight="700">Japan needs flexibility.</text>
  <text x="80" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">One tension. One proof. One system.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="300" width="430" height="390" rx="8" fill="#e9e1cf"/><rect x="80" y="300" width="8" height="390" fill="#b91c1c"/>
    <text x="116" y="350" fill="#991b1b" font-family="monospace" font-size="17" letter-spacing="3">01 · DEPENDENCY</text>
    <text x="116" y="415" fill="#162033" font-size="40" font-weight="700">Japan cannot borrow</text>
    <text x="116" y="475" fill="#334155" font-size="25">Hormuz route lands on an</text><text x="116" y="510" fill="#334155" font-size="25">island grid. 50 / 60 Hz seam.</text>
    <text x="116" y="635" fill="#64748b" font-family="monospace" font-size="15">INDIGO FIELD · VERMILION ALERT</text>
    <rect x="585" y="300" width="430" height="390" rx="8" fill="#f3ead5"/><rect x="585" y="300" width="8" height="390" fill="#d97706"/>
    <text x="621" y="350" fill="#92400e" font-family="monospace" font-size="17" letter-spacing="3">02 · PARADOX</text>
    <text x="621" y="415" fill="#162033" font-size="40" font-weight="700">Japan wastes what it has</text>
    <text x="621" y="475" fill="#334155" font-size="25">One solar day: noon surplus,</text><text x="621" y="510" fill="#334155" font-size="25">17:00 ramp. Same energy, lost.</text>
    <text x="621" y="635" fill="#64748b" font-family="monospace" font-size="15">WASHI CHART · AMBER SOLAR WASH</text>
    <rect x="1090" y="300" width="430" height="390" rx="8" fill="#e2ead8"/><rect x="1090" y="300" width="8" height="390" fill="#059669"/>
    <text x="1126" y="350" fill="#047857" font-family="monospace" font-size="17" letter-spacing="3">03 · PROOF + SCALE</text>
    <text x="1126" y="415" fill="#162033" font-size="40" font-weight="700">Homes become capacity</text>
    <text x="1126" y="475" fill="#334155" font-size="25">Shizen Connect proves it.</text><text x="1126" y="510" fill="#334155" font-size="25">ERAB + platform scale it.</text>
    <text x="1126" y="635" fill="#64748b" font-family="monospace" font-size="15">CITY GRAPH · CALM RESPONSE PATH</text>
  </g>
  <path d="M510 495H570M1015 495H1075" stroke="#fbbf24" stroke-width="5"/><path d="M560 480l20 15-20 15M1065 480l20 15-20 15" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <text x="80" y="810" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Shizen is operating proof, not an aside. ERAB is the contract; cloud-native is how that contract holds at city scale.</text>
</svg>
