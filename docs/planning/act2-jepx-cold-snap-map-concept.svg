<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KubeCon Japan keynote Act 2 concept</title>
  <desc id="desc">A 3D Japan grid mockup with cold-snap household demand zones and a JEPX 2021 price crisis sidecar chart.</desc>
  <defs>
    <radialGradient id="ocean" cx="45%" cy="62%" r="75%"><stop offset="0" stop-color="#12354c"/><stop offset=".42" stop-color="#071321"/><stop offset="1" stop-color="#060a1a"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="#060a1a"/>
  <rect x="40" y="40" width="1520" height="820" rx="10" fill="url(#ocean)" stroke="#1c3c55"/>
  <text x="85" y="102" fill="#22d3ee" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="4">ACT II / WINTER DEMAND</text>
  <text x="85" y="780" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="38" font-weight="700">Cold snap · homes become the pressure point</text>
  <text x="85" y="818" fill="#9aa9bb" font-family="Inter, sans-serif" font-size="20">Mask expands around regional homes · camera pauses at each grid zone</text>
